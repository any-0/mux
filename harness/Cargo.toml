[package]
name = "mux-harness"
version = "0.1.0"
edition = "2024"
publish = false
description = "Differential and end-to-end tests that drive mux as a black box"

# Standalone on purpose: alacritty_terminal enables `vte/std`, which must not
# leak into mux's own build through feature unification.
[workspace]

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0"
portable-pty = "0.9"
rand = { version = "0.9", features = ["small_rng"] }
serde_json = "1.0"
unicode-width = "0.2"
vt100 = { path = "../vendor/vt100" }
