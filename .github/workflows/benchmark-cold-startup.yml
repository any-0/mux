name: Cold restored-layout scale startup
on:
  pull_request:
    paths:
      - 'benchmarks/cold_startup.py'
      - 'benchmarks/audit_cold_startup.py'
      - '.github/workflows/benchmark-cold-startup.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-cold-startup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BENCH_MUX_SOURCE_DIR: ${{ github.workspace }}/pinned-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reuse audited cold startup when inputs match
        id: evidence
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          needed=true
          if [ "$EVENT_NAME" != workflow_dispatch ] && [ -f benchmarks/cold-results-run ]; then
            run=$(cat benchmarks/cold-results-run)
            measured=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["branch_head"])' "benchmarks/results/hosted-ci/$run/manifest.json")
            if git cat-file -e "$measured^{commit}" && git diff --quiet "$measured" HEAD -- benchmarks/cold_startup.py benchmarks/audit_cold_startup.py benchmarks/interactive.py benchmarks/recovery.py benchmarks/run.py benchmarks/mux-revision .nix scripts/benchmark-nix ':(exclude).nix/flake.nix' && python3 benchmarks/retained_cold_inputs.py "$measured"; then
              needed=false
            fi
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - id: pin
        run: echo "revision=$(cat benchmarks/mux-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.pin.outputs.revision }}
          path: pinned-runtime
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Correctness preflight all scales
        if: steps.evidence.outputs.needed == 'true'
        run: |
          for w in 1 3 6; do
            ./scripts/benchmark-nix python3 benchmarks/cold_startup.py --output "$RUNNER_TEMP/cold-preflight-w$w" --windows "$w" --smoke
          done
      - name: Sequential shuffled paired scales
        if: steps.evidence.outputs.needed == 'true'
        run: |
          for w in 1 3 6; do
            ./scripts/benchmark-nix python3 benchmarks/cold_startup.py --output "$RUNNER_TEMP/cold-w$w" --windows "$w" --trials 20
            ./scripts/benchmark-nix python3 benchmarks/audit_cold_startup.py "$RUNNER_TEMP/cold-w$w" | tee "$RUNNER_TEMP/cold-w$w/audit.json"
          done
      - name: Preserve raw and failed evidence
        if: steps.evidence.outputs.needed == 'true' && (always())
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cold-startup-${{ github.run_id }}
          path: ${{ runner.temp }}/cold-*
          retention-days: 30
      - name: Re-audit retained cold startup
        if: steps.evidence.outputs.needed == 'false'
        run: |
          run=$(cat benchmarks/cold-results-run)
          nix develop ./.nix#benchmark --command python3 benchmarks/render_cold_startup_results.py "benchmarks/results/hosted-ci/$run"
