name: Tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Format new fixtures with the pinned formatter
        run: |
          nix develop ./.nix --command cargo fmt --all
          git diff
      - name: Test with the pinned project toolchain
        run: ./scripts/test-nix
      - name: Confirm the regression witnesses fail on the old implementation
        run: nix develop ./.nix --command ./scripts/check-regression-witnesses 9c74b7029e6112175d0914c0efc12d87317efccf
