name: Benchmark harness validation

on:
  pull_request:
    paths:
      - '.github/workflows/benchmark-validation.yml'
      - '.nix/**'
      - 'benchmarks/**'
      - 'scripts/benchmark-nix'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BENCH_EXECUTION_CONTEXT: hosted-ci-correctness-validation
      BENCH_MUX_SOURCE_DIR: ${{ github.workspace }}/pinned-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Read exact runtime pin
        id: pin
        run: echo "revision=$(cat benchmarks/mux-revision)" >> "$GITHUB_OUTPUT"
      - name: Checkout exact pinned mux runtime independently
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.pin.outputs.revision }}
          path: pinned-runtime
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # same pin as PR 2
      - name: Unit and actual PTY correctness tests in the development Nix pin
        run: |
          mkdir -p ci-validation
          nix develop ./.nix#benchmark --command python3 -m unittest discover -s benchmarks -p test_benchmarks.py -v 2>&1 | tee ci-validation/tests.log
      - name: Validate real mux and tmux integrations sequentially
        run: ./scripts/benchmark-nix python3 benchmarks/ci_validate.py --output "$RUNNER_TEMP/mux-ci-validation"
      - name: Independently audit the retained performance dataset
        run: |
          nix develop ./.nix#benchmark --command python3 -m zipfile -e benchmarks/results/hosted-ci/36744338567/raw.zip "$RUNNER_TEMP/retained-performance"
          nix develop ./.nix#benchmark --command python3 benchmarks/audit_hosted.py "$RUNNER_TEMP/retained-performance" | tee ci-validation/performance-audit.json
      - name: Independently re-audit retained cold-startup samples
        if: hashFiles('benchmarks/cold-results-run') != ''
        run: |
          revision=$(cat benchmarks/cold-results-run)
          nix develop ./.nix#benchmark --command python3 benchmarks/render_cold_startup_results.py "benchmarks/results/hosted-ci/$revision" | tee ci-validation/cold-startup-audit.md
      - name: Keep complete diagnostics even when a correctness gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-ci-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-validation/
            ${{ runner.temp }}/mux-ci-validation/
          retention-days: 30
