name: Independent terminal correctness stress
on:
  pull_request:
    paths: ['stress/**', 'src/**', 'vendor/**', '.nix/**', 'scripts/stress-nix', '.github/workflows/terminal-stress.yml']
  push:
    branches: ['test/terminal-correctness-stress']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terminal-stress-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sessions:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Oracle protocol vectors and pinned build
        run: |
          ./scripts/stress-nix python3 -m unittest discover -s stress -p test_oracle.py -v
          ./scripts/stress-nix cargo build --locked
      - name: Adversarial bash, zsh, fish sessions
        run: ./scripts/stress-nix python3 stress/run.py --binary target/debug/mux --output "$RUNNER_TEMP/terminal-stress" --cycles 40
      - name: Preserve raw pane and client bytes, actions, resize ordering, cell diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terminal-stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminal-stress
          retention-days: 30
