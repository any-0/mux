name: Independent terminal correctness stress
on:
  pull_request:
    paths: ['stress/**', 'src/**', 'vendor/**', '.nix/**', 'scripts/stress-nix', '.github/workflows/terminal-stress.yml']
  push:
    branches: ['test/terminal-correctness-stress']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terminal-stress-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sessions:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, zsh, fish]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Oracle protocol vectors and pinned build
        run: |
          ./scripts/stress-nix python3 -m unittest discover -s stress -p test_oracle.py -v
          ./scripts/stress-nix cargo build --locked
      - name: Baseline reproductions on verified pre-fix main
        if: matrix.shell == 'bash'
        run: |
          git worktree add --detach "$RUNNER_TEMP/stress-baseline" d6dd228054231e77772bd17a412d8f0d07871835
          ./scripts/stress-nix sh -c 'cd "$1"; cargo build --locked --target-dir "$2"' sh "$RUNNER_TEMP/stress-baseline" "$RUNNER_TEMP/baseline-target"
          ./scripts/stress-nix python3 stress/witnesses.py --case intensity --expect-baseline-failure --binary "$RUNNER_TEMP/baseline-target/debug/mux" --output "$RUNNER_TEMP/terminal-witnesses/baseline-intensity"
          ./scripts/stress-nix python3 stress/witnesses.py --case sidebar --expect-baseline-failure --binary "$RUNNER_TEMP/baseline-target/debug/mux" --output "$RUNNER_TEMP/terminal-witnesses/baseline-sidebar"
      - name: Fixed minimized witnesses
        if: matrix.shell == 'bash'
        run: |
          ./scripts/stress-nix python3 stress/witnesses.py --case intensity --binary target/debug/mux --output "$RUNNER_TEMP/terminal-witnesses/fixed-intensity"
          ./scripts/stress-nix python3 stress/witnesses.py --case sidebar --binary target/debug/mux --output "$RUNNER_TEMP/terminal-witnesses/fixed-sidebar"
      - name: Unproxied shell and Vim process icons, signals, and sidebar tiles
        run: ./scripts/stress-nix python3 stress/sidebar_sessions.py --binary target/debug/mux --output "$RUNNER_TEMP/sidebar-stress" --shell ${{ matrix.shell }}
      - name: 240-cycle adversarial soak (30-minute profile budget)
        run: ./scripts/stress-nix python3 stress/run.py --binary target/debug/mux --output "$RUNNER_TEMP/terminal-stress" --cycles 240 --shells ${{ matrix.shell }}
      - name: Replay every terminal checkpoint from saved bytes and resize offsets
        run: ./scripts/stress-nix python3 stress/replay.py "$RUNNER_TEMP/terminal-stress/${{ matrix.shell }}"
      - name: Preserve raw pane and client bytes, actions, resize ordering, cell diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terminal-stress-${{ matrix.shell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/terminal-stress/
            ${{ runner.temp }}/terminal-witnesses/
            ${{ runner.temp }}/sidebar-stress/
          retention-days: 30
